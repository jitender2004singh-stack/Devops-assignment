services:
  db:
    image: postgres:16
    container_name: hotel-bookings-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookings
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Files in /docker-entrypoint-initdb.d run once, in alphabetical order,
      # the first time the data volume is created.
      - ./db/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
      - ./db/migrations/002_add_indexes.sql:/docker-entrypoint-initdb.d/002_add_indexes.sql:ro
      - ./db/seed/seed.sql:/docker-entrypoint-initdb.d/003_seed.sql:ro
    healthcheck:
      # -h 127.0.0.1 forces a TCP check, so it only passes once the *final*
      # server is up (the temporary init-time server listens on a socket only).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d bookings"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
